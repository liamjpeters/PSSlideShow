{{ define "main" }}
  <section class="flex min-h-[60vh] items-center justify-center py-12" aria-labelledby="not-found-title">
    <div class="w-full max-w-2xl overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-800">
      <div class="flex items-center gap-2 border-b border-gray-200 px-5 py-3 dark:border-gray-700" aria-hidden="true">
        <span class="h-3 w-3 rounded-full bg-red-400"></span>
        <span class="h-3 w-3 rounded-full bg-yellow-400"></span>
        <span class="h-3 w-3 rounded-full bg-green-400"></span>
        <span class="ml-2 font-mono text-xs text-gray-500 dark:text-gray-400">PSSlideShow</span>
      </div>
      <div class="p-6 md:p-10">
        <p class="mb-3 font-mono text-sm font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-400">Error 404 · Page not found</p>
        <h1 id="not-found-title" class="mb-4 text-3xl font-bold text-gray-900 md:text-4xl dark:text-white">Looks like this slide is off the deck.</h1>
        <p class="mb-6 text-lg text-gray-600 dark:text-gray-300">
          The address may be out of date, or the page may have moved. Try one of these instead:
        </p>
        <div class="mb-8 rounded-lg bg-gray-900 p-4 font-mono text-sm text-gray-100">
          <p><span class="text-green-400">PS&gt;</span> Get-Content <span class="text-indigo-300">$requestedPage</span></p>
          <p class="mt-1 text-red-300">Page not found.</p>
        </div>
        <div class="flex flex-wrap gap-3">
          <a href="{{ site.Home.RelPermalink }}"
             class="rounded-lg bg-gray-800 px-5 py-3 font-semibold text-white hover:bg-gray-700 dark:bg-gray-100 dark:text-gray-900 dark:hover:bg-white">Back to home</a>
          <a href="{{ (site.GetPage "/cmdlets").RelPermalink }}"
             class="rounded-lg border border-gray-300 px-5 py-3 font-semibold text-gray-800 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-100 dark:hover:bg-gray-700">Browse cmdlets</a>
          <a href="{{ (site.GetPage "/widgets").RelPermalink }}"
             class="rounded-lg border border-gray-300 px-5 py-3 font-semibold text-gray-800 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-100 dark:hover:bg-gray-700">Explore widgets</a>
        </div>
      </div>
    </div>
  </section>
{{ end }}
