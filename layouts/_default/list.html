{{ define "main" }}
  <header class="mb-8">
    <h1 class="mb-3 text-4xl font-bold text-gray-900 dark:text-white">{{ .Title }}</h1>
    <p class="text-lg text-gray-600 dark:text-gray-300">{{ .Description }}</p>
  </header>
  {{ with .Content }}
    <div class="mb-8 prose dark:prose-invert">{{ . }}</div>
  {{ end }}
  <div class="grid gap-6 md:grid-cols-2">
    {{ range .RegularPages.ByTitle }}
      <a href="{{ .RelPermalink }}"
         class="block h-full p-6 transition-shadow bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 hover:shadow-md dark:shadow-none">
        <h2 class="mb-2 text-xl font-semibold text-gray-900 dark:text-white">{{ .Title }}</h2>
        <p class="text-gray-700 dark:text-gray-300">{{ .Description }}</p>
      </a>
    {{ end }}
  </div>
{{ end }}
