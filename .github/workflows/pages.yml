name: Refresh documentation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'Directory.Build.props'
      - 'build.ps1'
      - 'build-docs.ps1'
      - 'docs/PSSlideShow/**'
      - 'module/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch site build on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref gh-pages
