name: Release

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check runner PowerShell version
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
            throw "PowerShell 7.6+ is required; this runner has $($PSVersionTable.PSVersion)."
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install test and help modules for PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module Pester -ListAvailable |
              Where-Object Version -GE ([version]'6.0.0') | Select-Object -First 1)) {
            Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Install-Module Microsoft.PowerShell.PlatyPS -RequiredVersion 1.0.3 -Scope CurrentUser -Force

      - name: Install Pester for Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module Pester -ListAvailable |
              Where-Object Version -GE ([version]'6.0.0') | Select-Object -First 1)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Build and test release module
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Docs

      - name: Check release version
        shell: pwsh
        run: |
          $moduleVersion = (Import-PowerShellDataFile -Path .\module\PSSlideShow.psd1).ModuleVersion
          $expectedTag = "v$moduleVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' must match the manifest ModuleVersion ('$expectedTag')."
          }

      - name: Package module
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'PSSlideShow'
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Get-ChildItem -LiteralPath .\module | Copy-Item -Destination $packageDir -Recurse -Force
          $archive = Join-Path $env:RUNNER_TEMP "PSSlideShow-$($env:RELEASE_TAG.Substring(1)).zip"
          Compress-Archive -LiteralPath $packageDir -DestinationPath $archive

      - name: Attach archive to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "PSSlideShow-$($env:RELEASE_TAG.Substring(1)).zip"
          gh release upload $env:RELEASE_TAG $archive --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Uploading the release archive failed ($LASTEXITCODE)." }

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Module -Path .\module -Repository PSGallery `
            -NuGetApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
